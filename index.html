<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%230b2a5b%22 stroke=%22%23f2b01e%22 stroke-width=%226%22/%3E%3C/svg%3E" />
    <title>Luke's Team Playbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef1f7;
        --surface: #ffffff;
        --surface-2: #e3e9f4;
        --ink: #101c33;
        --ink-soft: #44506a;
        --line: #c9d3e6;
        --navy: #0b2a5b;
        --navy-deep: #071c3f;
        --gold: #f2b01e;
        --gold-ink: #231a02;
        --field: #1e6b34;
        --field-dark: #17542a;
        --accent: #0b2a5b;
        --btn-ink: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #080d18;
          --surface: #101a2e;
          --surface-2: #182642;
          --ink: #eef2fa;
          --ink-soft: #a7b3cc;
          --line: #2a3a5c;
          --accent: #7ea6ec;
          --btn-ink: #ffffff;
        }
      }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { margin: 0; padding: 0; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; }
      button, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

      .ctl:focus-visible, .navbtn:focus-visible, .mode-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

      /* ---------- Mode toggle ---------- */
      .mode-toggle { display: flex; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); padding: 6px; border-radius: 14px; margin-bottom: 16px; }
      .mode-btn {
        flex: 1; min-height: 56px; border: none; border-radius: 10px; background: transparent;
        color: var(--ink-soft); font-size: 17px; font-weight: 700;
      }
      .mode-btn[aria-pressed="true"] { background: var(--navy); color: #fff; }

      /* ---------- Play header ---------- */
      .play-head {
        display: flex; align-items: center; gap: 10px 16px;
        padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));
      }
      .head-text { flex: 1; min-width: 0; }
      .play-count {
        font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .18em;
        font-size: 13px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 2px;
      }
      h2 {
        font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase;
        font-size: clamp(28px, 5.4vw, 40px); line-height: 1.02; margin: 0;
      }
      /* ---------- Stage: the diagram fills the whole page ---------- */
      .stage { touch-action: pan-y; flex: 1; min-height: 0; display: flex; flex-direction: column; }
      @media (orientation: landscape) {
        h2 { font-size: 30px; }
      }

      /* One page, everything visible: the diagram takes every bit of
         space the controls don't use. On wide / landscape screens the
         controls sit in a column beside it; in portrait they stack
         underneath it. The SVG's own background is field green, so
         any letterbox area reads as more field, not empty page. */
      .main {
        flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px;
        padding: 4px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      }
      .field-card { flex: 1; min-height: 0; display: flex; }
      #diagram { flex: 1; min-width: 0; min-height: 0; display: flex; }
      .field-card svg { display: block; width: 100%; height: 100%; border-radius: 12px; background: #1e6b34; }
      .side { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; min-height: 0; max-height: 54%; padding: 2px; }
      .side > * { flex: none; }
      @media (orientation: landscape), (min-width: 900px) {
        .main { flex-direction: row; }
        .side { width: 350px; flex: none; max-height: none; }
      }

      /* iPad: everything finger-sized, nothing tiny. */
      @media (min-width: 700px) {
        .ctl { min-height: 68px; font-size: 18px; }
        h2 { font-size: 38px; }
      }
      .side .mode-toggle { margin-bottom: 4px; flex: none; }
      .side .target-row { margin-top: 14px; }
      .side .target-row.qb-row { margin-top: 0; }

      /* Play / Reset / Mix: one equal row in the control column,
         always visible on the page with everything else. */
      .controls {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
        margin-top: 14px; flex: none;
      }
      .ctl {
        min-height: 64px; padding: 12px 6px; border-radius: 12px; border: none; width: 100%;
        font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
        gap: 6px; white-space: nowrap;
      }
      .ctl.play { background: var(--gold); color: var(--gold-ink); }
      .ctl.play[disabled] { opacity: .55; cursor: default; }
      .ctl.reset, .ctl.mix { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); }
      .status { margin: 10px 2px 0; font-size: 15px; color: var(--ink-soft); min-height: 1.3em; }

      /* ---------- Target picker ---------- */
      .target-row { display: flex; align-items: center; gap: 10px; margin-top: 20px; margin-bottom: 12px; }
      .target-row.qb-row { margin-top: 0; }
      .target-row label { font-size: 15px; font-weight: 700; white-space: nowrap; min-width: 54px; }
      .target-row select {
        flex: 1; min-width: 0; min-height: 56px; padding: 10px 30px 10px 12px; border-radius: 12px;
        border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
        font-family: inherit; font-size: 16px; font-weight: 600;
      }
      .target-row select[disabled] { opacity: .45; }
      .target-row select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

      /* ---------- Subs ---------- */
      .subs { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
      .subs-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .subs-head strong { font-size: 15px; }
      .bench-chip {
        display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px;
        background: var(--surface-2); border: 1.5px solid var(--line);
        font-size: 14.5px; font-weight: 700; color: var(--ink);
      }
      .bench-empty { font-size: 14.5px; color: var(--ink-soft); }
      .sub-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .sub-row label { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
      .sub-row select {
        flex: 1 1 110px; min-width: 0; min-height: 56px; padding: 8px 10px; border-radius: 10px;
        border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
        font-family: inherit; font-size: 16px; font-weight: 600;
      }
      .sub-row select:focus-visible, .sub-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      .sub-arrow { font-weight: 800; color: var(--ink-soft); }
      .sub-btn {
        min-height: 56px; padding: 12px 18px; border-radius: 10px; border: none; width: 100%;
        margin-top: 8px; background: var(--navy); color: #fff; font-size: 16px; font-weight: 700;
      }
      .sub-btn[disabled] { opacity: .45; cursor: default; }

      /* ---------- Footer nav ---------- */
      .pager { display: flex; gap: 10px; margin-top: 14px; }
      .hint { margin: 12px 0 0; text-align: center; font-size: 14px; color: var(--ink-soft); }
      .navbtn {
        min-height: 60px; padding: 12px 20px; border-radius: 12px; font-size: 17px; font-weight: 700;
        background: var(--navy); color: #fff; border: none; flex: 1;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      }
      .navbtn.prev { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
      .navbtn[disabled] { opacity: .4; cursor: default; }

      /* ---------- SVG diagram ---------- */
      .route { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
      .route.patrol { stroke-dasharray: 2 7; stroke-width: 2.6; opacity: .5; }
      .route.primary { stroke: var(--gold); stroke-width: 4; opacity: 1; }
      .route.dash { stroke-dasharray: 7 6; stroke: #ffd97a; }
      .ballpath { fill: none; stroke: #ffd97a; stroke-width: 2.2; stroke-dasharray: 3 6; stroke-linecap: round; opacity: .75; }
      .p-name { font-family: "Inter", sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .p-name.dark { fill: var(--gold-ink); }
      .ball { pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="stage" id="stage" aria-live="polite">
        <div class="play-head">
          <div class="head-text">
            <p class="play-count" id="playCount"></p>
            <h2 id="playName"></h2>
          </div>
        </div>

        <div class="main">
          <div class="field-card">
            <div id="diagram"></div>
          </div>

          <div class="side">
          <div class="mode-toggle" role="group" aria-label="Offense or defense">
            <button class="mode-btn" id="btnOffense" type="button" aria-pressed="true">Offense</button>
            <button class="mode-btn" id="btnDefense" type="button" aria-pressed="false">Defense</button>
          </div>
          <div class="target-row">
              <label for="targetSelect">Target</label>
              <select id="targetSelect" aria-label="Choose who gets the ball">
                <option value="auto" selected>Select</option>
                <option value="Yusuf">Yusuf</option>
                <option value="Kevin">Kevin</option>
                <option value="Carlos">Carlos</option>
                <option value="Luke">Luke</option>
                <option value="Anderson">Anderson</option>
                <option value="Eli">Eli</option>
                <option value="Kaden">Kaden</option>
                <option value="Arwen">Arwen</option>
              </select>
            </div>
            <div class="target-row qb-row">
              <label for="qbSelect">QB</label>
              <select id="qbSelect" aria-label="Choose who plays quarterback">
                <option value="auto" selected>Auto — Luke/Anderson</option>
                <option value="Luke">Luke</option>
                <option value="Anderson">Anderson</option>
              </select>
            </div>
            <div class="controls" aria-label="Play actions">
              <button class="ctl play" id="btnPlay" type="button">▶&nbsp; Play</button>
              <button class="ctl reset" id="btnReset" type="button">↺&nbsp; Reset</button>
              <button class="ctl mix" id="btnMix" type="button">⇄&nbsp; Mix</button>
            </div>
            <div class="subs" aria-label="Substitutions">
              <div class="subs-head">
                <strong>Subs</strong>
                <span id="benchList"></span>
              </div>
              <div class="sub-row">
                <label for="subOutSelect">Out</label>
                <select id="subOutSelect" aria-label="Player coming off the field"></select>
                <span class="sub-arrow" aria-hidden="true">→</span>
                <label for="subInSelect">In</label>
                <select id="subInSelect" aria-label="Sub coming onto the field"></select>
              </div>
              <button class="sub-btn" id="btnSub" type="button">Make Sub</button>
            </div>
          <p class="status" id="status"></p>
          <div class="pager">
            <button class="navbtn prev" id="btnPrev" type="button">← Prev</button>
            <button class="navbtn" id="btnNext" type="button">Next →</button>
          </div>
          <p class="hint">Swipe left or right to change plays</p>
          </div>
        </div>
      </section>
    </div>

        if (pts.length === 2) { d += " L " + pts[1][0] + " " + pts[1][1]; return d; }
        for (var i = 1; i < pts.length - 1; i++) {
          var mx = (pts[i][0] + pts[i + 1][0]) / 2;

         the bench (a bench player can't take the field from here). */
      function seatPickedQB() {
        if (selectedQB === "auto") return;
        var pickSpot = spotOf(selectedQB);
        if (pickSpot && pickSpot !== "Luke") {
          assignment[pickSpot] = assignment["Luke"];
          assignment["Luke"] = selectedQB;
        }
      }

      function resetAssignment(i) {
        /* Rebuild the diagram from the persistent lineup, so subs stay
           subbed (and bench players stay off the field) across plays. */
        ACTIVE_SPOTS.forEach(function (spot) { assignment[spot] = lineup[spot]; });
        /* QB: by default Luke and Anderson swap QB positions play by
           play — on Anderson's plays he takes the QB spot (gold circle)
           and Luke takes his front spot. If the QB picker locked one of
           them in instead, he takes the QB spot on every play.
           The Auto swap is skipped if either is on the bench or a sub
           is holding QB; a locked-in pick is skipped only if the
           picked QB himself is on the bench. */
        if (mode === "offense") {
          if (selectedQB !== "auto") {
            seatPickedQB();
          } else if (PLAYS[i].qb === "Anderson") {
            var qbHolder = assignment["Luke"];
            var andSpot = spotOf("Anderson");
            if ((qbHolder === "Luke" || qbHolder === "Anderson") && andSpot) {
              assignment["Luke"] = "Anderson";
              assignment[andSpot] = qbHolder;

        applyTarget();
      }

      function applyTarget() {
        if (mode !== "offense" || selectedTarget === "auto") return;
        var primarySpot = PLAYS[current].primary;
        var holder = null;
        ACTIVE_SPOTS.forEach(function (spot) {
          if (assignment[spot] === selectedTarget) holder = spot;
        });
        if (!holder || holder === primarySpot) return;
        assignment[holder] = assignment[primarySpot];
        assignment[primarySpot] = selectedTarget;

          return '<option value="' + n + '">' + n + "</option>";

        if (field.indexOf(prevOut) >= 0) subOutSelect.value = prevOut;
        var prevIn = subInSelect.value;
        subInSelect.innerHTML = bench.map(function (n) {
          return '<option value="' + n + '">' + n + "</option>";
        }).join("");
        if (bench.indexOf(prevIn) >= 0) subInSelect.value = prevIn;
        btnSub.disabled = bench.length === 0 || field.length === 0;
        subOutSelect.disabled = bench.length === 0;
        subInSelect.disabled = bench.length === 0;

           (Sebas / Ethan at the start) can't be picked until subbed in. */
        var prevTarget = selectedTarget;
        targetSelect.innerHTML = '<option value="auto">Select</option>' + field.map(function (n) {
          return '<option value="' + n + '">' + n + "</option>";
        }).join("");

          selectedTarget = "auto";
          targetSelect.value = "auto";

      /* Swap one specific player out for one specific sub: the sub
         takes that player's exact spot, route and zone, and the
         player who came off joins the bench. Stays in across plays. */
      function doSub() {
        var outName = subOutSelect.value;
        var inName = subInSelect.value;
        if (!outName || !inName) return;
        var spot = lineupSpotOf(outName);
        if (!spot || bench.indexOf(inName) < 0) return;
        cancelAnim();
        lineup[spot] = inName;
        bench = bench.filter(function (n) { return n !== inName; });
        bench.push(outName);
        if (selectedTarget === outName) selectedTarget = "auto";
        if (selectedQB === outName) { selectedQB = "auto"; qbSelect.value = "auto"; }
        resetAssignment(current);
        buildCurrent();
        refreshSubUI();
        btnPlay.disabled = false;
        btnPlay.innerHTML = "▶&nbsp; Play";
        statusEl.textContent = "Sub: " + inName + " in for " + outName + " — " + inName + " takes " + outName + "'s spot. " + outName + " is on the bench now.";

        var list = currentList();
        var item = list[i];
        document.getElementById("playCount").textContent =
          (mode === "defense" ? "Zone " : "Play ") + (i + 1) + " of " + list.length;
        document.getElementById("playName").textContent = "" + item.name;
        buildCurrent();
        refreshSubUI();
        btnPrev.disabled = i === 0;
        btnNext.disabled = i === list.length - 1;
        btnPlay.disabled = false;
        btnPlay.innerHTML = "▶&nbsp; Play";
        targetSelect.disabled = mode === "defense";
        qbSelect.disabled = mode === "defense";
        statusEl.textContent = mode === "defense"
          ? "Zones are set. Tap Play — it starts with the snap."
          : (selectedTarget !== "auto"
              ? "Diagram set for " + selectedTarget + " to get the ball. Tap Play — snap first."
              : "Ball is with the center. Tap Play — snap to the QB first.");
      }

      function setMode(m) {
        if (m === mode) return;
        savedIdx[mode] = current;
        mode = m;
        document.getElementById("btnOffense").setAttribute("aria-pressed", m === "offense" ? "true" : "false");
        document.getElementById("btnDefense").setAttribute("aria-pressed", m === "defense" ? "true" : "false");
        show(savedIdx[m]);
      }

      function mixNames() {
        cancelAnim();
        /* Mix = complete shuffle of the players ON the field only:
           bench players (Sebas and Ethan to start) stay on the bench
           and never get shuffled in. On defense Yusuf stays locked
           on QB rush if he's on the field. Mixing clears any Target
           pick, since the shuffle decides who gets the ball. */
        selectedTarget = "auto";
        targetSelect.value = "auto";
        var spots = ACTIVE_SPOTS.slice();
        var lockYusuf = mode === "defense" && lineupSpotOf("Yusuf");
        if (lockYusuf) spots = spots.filter(function (s) { return s !== "Yusuf"; });
        var baseNames = spots.map(function (s) { return lineup[s]; });
        var names = baseNames.slice();
        for (var attempt = 0; attempt < 12; attempt++) {
          names = baseNames.slice();
          for (var k = names.length - 1; k > 0; k--) {
            var j = Math.floor(Math.random() * (k + 1));
            var tmp = names[k]; names[k] = names[j]; names[j] = tmp;
          }
          var same = spots.every(function (spot, idx) { return lineup[spot] === names[idx]; });
          if (!same) break;
        }
        spots.forEach(function (spot, idx) { lineup[spot] = names[idx]; });
        ACTIVE_SPOTS.forEach(function (spot) { assignment[spot] = lineup[spot]; });
        /* A locked-in QB pick survives the shuffle: he keeps the gold
           QB spot, everyone else stays wherever Mix put them. */
        if (mode === "offense") seatPickedQB();
        buildCurrent();
        refreshSubUI();
        btnPlay.disabled = false;
        btnPlay.innerHTML = "▶&nbsp; Play";
        statusEl.textContent = mode === "defense"
          ? "Shuffled on the field — Yusuf still rushes the QB, subs stay on the bench. Tap Play to run it."
          : "Shuffled on the field — new names in every spot, subs stay on the bench. Tap Play to run it.";
      }

      function cancelAnim() {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      }

      function setPlayerPos(name, x, y) {
        var el = diagramEl.querySelector('[data-player="' + name + '"]');
        if (el) el.setAttribute("transform", "translate(" + x + "," + y + ")");
      }

      function resetPositions() {
        cancelAnim();
        ACTIVE_SPOTS.forEach(function (name) {
          var s = startPos[name];
          if (s) setPlayerPos(name, s.x, s.y);
        });
        var ball = document.getElementById("ball");
        var home = ballHome();
        if (ball) ball.setAttribute("transform", "translate(" + home.x + "," + home.y + ")");
        btnPlay.disabled = false;
        btnPlay.innerHTML = "▶&nbsp; Play";
        statusEl.textContent = mode === "defense"
          ? "Zones are set. Tap Play — it starts with the snap."
          : "Ball is with the center. Tap Play — snap to the QB first.";
      }

      function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

      function runPlay() {
        var play = currentList()[current];
        resetPositionsSilent();
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var movers = [];
        ACTIVE_SPOTS.forEach(function (name, idx) {
          var pathEl = diagramEl.querySelector('[data-route="' + name + '"]');
          if (!pathEl) return;
          var len = 0;
          try { len = pathEl.getTotalLength(); } catch (e) { len = 0; }
          movers.push({ name: name, pathEl: pathEl, len: len, delay: idx * 50 });
        });

        var ballEl = document.getElementById("ball");
        var ballPathEl = document.getElementById("ballPath");
        var ballLen = 0;
        if (ballPathEl) { try { ballLen = ballPathEl.getTotalLength(); } catch (e) { ballLen = 0; } }
        var runnerPathEl = null, runnerLen = 0, runnerDelay = 0;
        if (play.ballWith) {
          runnerPathEl = diagramEl.querySelector('[data-route="' + play.ballWith + '"]');
          if (runnerPathEl) { try { runnerLen = runnerPathEl.getTotalLength(); } catch (e) { runnerLen = 0; } }
          runnerDelay = ACTIVE_SPOTS.indexOf(play.ballWith) * 50;
        }

        /* Every play starts with the snap: for SNAP ms the ball travels
           from the center back to the QB while everyone holds still.
           Only then do the routes / zones develop. */
        var SNAP = 600, DURATION = 3400, THROW_DELAY = 650, BALL_DUR = 1600;
        var total = SNAP + DURATION + 600;
        var snapFrom = ballHome();
        var snapTo = qbBallPos();
        if (ballPathEl && play.ball) snapTo = { x: FX(play.ball[0][0]), y: FY(play.ball[0][1]) };

        function setBall(x, y) {
          if (ballEl) ballEl.setAttribute("transform", "translate(" + x + "," + y + ")");
        }
        function lerp(a, b, t) { return a + (b - a) * t; }

        function finish() {
          movers.forEach(function (m) {
            if (m.len > 0) { var pt = m.pathEl.getPointAtLength(m.len); setPlayerPos(m.name, pt.x, pt.y); }
          });
          if (ballEl) {
            if (ballPathEl && ballLen > 0) { var bp = ballPathEl.getPointAtLength(ballLen); setBall(bp.x, bp.y); }
            else if (runnerPathEl && runnerLen > 0) { var rp = runnerPathEl.getPointAtLength(runnerLen); setBall(rp.x, rp.y - 12); }
            else setBall(snapTo.x, snapTo.y);
          }
          btnPlay.disabled = false;
          btnPlay.innerHTML = "↻&nbsp; Replay";
          statusEl.textContent = "Play complete.";
        }

        if (reduced) { finish(); return; }

        btnPlay.disabled = true;
        btnPlay.innerHTML = "Running…";
        statusEl.textContent = "Snap… play is live.";

        var startTs = null;
        function frame(ts) {
          if (startTs === null) startTs = ts;
          var elapsed = ts - startTs;
          var posMap = {};
          movers.forEach(function (m) {
            if (m.len <= 0) return;
            var t = (elapsed - SNAP - m.delay) / DURATION;
            if (t < 0) t = 0; if (t > 1) t = 1;
            var pt = m.pathEl.getPointAtLength(m.len * easeInOut(t));
            setPlayerPos(m.name, pt.x, pt.y);
            posMap[m.name] = pt;
          });
          if (ballEl) {
            if (elapsed < SNAP) {
              /* the snap itself: center -> QB, nobody else moves yet */
              var st = easeInOut(elapsed / SNAP);
              setBall(lerp(snapFrom.x, snapTo.x, st), lerp(snapFrom.y, snapTo.y, st));
            } else if (ballPathEl && ballLen > 0) {
              var bt = (elapsed - SNAP - THROW_DELAY) / BALL_DUR;
              if (bt < 0) bt = 0; if (bt > 1) bt = 1;
              var bp2 = ballPathEl.getPointAtLength(ballLen * easeInOut(bt));
              setBall(bp2.x, bp2.y);
            } else if (runnerPathEl && runnerLen > 0) {
              if (elapsed < SNAP + 350) {
                /* handoff: QB -> runner as he arrives */
                var ht = easeInOut((elapsed - SNAP) / 350);
                var r0 = runnerPathEl.getPointAtLength(0);
                setBall(lerp(snapTo.x, r0.x, ht), lerp(snapTo.y, r0.y - 12, ht));
              } else {
                var rt = (elapsed - SNAP - runnerDelay) / DURATION;
                if (rt < 0) rt = 0; if (rt > 1) rt = 1;
                var rp2 = runnerPathEl.getPointAtLength(runnerLen * easeInOut(rt));
                setBall(rp2.x, rp2.y - 12);
              }
            } else {
              setBall(snapTo.x, snapTo.y);
            }
          }
          if (elapsed < total) { rafId = requestAnimationFrame(frame); }
          else { rafId = null; finish(); }
        }
        rafId = requestAnimationFrame(frame);
      }

      function resetPositionsSilent() {
        cancelAnim();
        ACTIVE_SPOTS.forEach(function (name) {
          var s = startPos[name];
          if (s) setPlayerPos(name, s.x, s.y);
        });
        var ball = document.getElementById("ball");
        var home = ballHome();
        if (ball) ball.setAttribute("transform", "translate(" + home.x + "," + home.y + ")");
      }

      btnPlay.addEventListener("click", runPlay);
      btnReset.addEventListener("click", resetPositions);
      btnMix.addEventListener("click", mixNames);
      btnSub.addEventListener("click", doSub);

      targetSelect.addEventListener("change", function () {
        cancelAnim();
        selectedTarget = targetSelect.value;
        if (mode === "offense") {
          resetAssignment(current);
          buildCurrent();
          btnPlay.disabled = false;
          btnPlay.innerHTML = "▶&nbsp; Play";
          statusEl.textContent = selectedTarget === "auto"
            ? "Ball is with the center. Tap Play — snap to the QB first."
            : "Diagram set for " + selectedTarget + " to get the ball. Tap Play — snap first.";
        }
      });
      qbSelect.addEventListener("change", function () {
        cancelAnim();
        selectedQB = qbSelect.value;
        if (mode === "offense") {
          resetAssignment(current);
          buildCurrent();
          btnPlay.disabled = false;
          btnPlay.innerHTML = "▶&nbsp; Play";
          statusEl.textContent = selectedQB === "auto"
            ? "QB back to Auto — Luke and Anderson swap by play."
            : selectedQB + " is your QB — he takes the gold QB spot on every play.";
        }
      });
      document.getElementById("btnOffense").addEventListener("click", function () { setMode("offense"); });
      document.getElementById("btnDefense").addEventListener("click", function () { setMode("defense"); });
      btnPrev.addEventListener("click", function () { if (current > 0) show(current - 1); });
      btnNext.addEventListener("click", function () { if (current < currentList().length - 1) show(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft" && current > 0) show(current - 1);
        if (e.key === "ArrowRight" && current < currentList().length - 1) show(current + 1);
      });

      /* Swipe left / right anywhere on the stage to change plays (iPad touch).
         Vertical scroll still works: only mostly-horizontal swipes count. */
      var stageEl = document.getElementById("stage");
      var swipeX = null, swipeY = null;
      stageEl.addEventListener("touchstart", function (e) {
        if (e.target.closest && e.target.closest(".side")) { swipeX = null; swipeY = null; return; }
        if (e.changedTouches.length === 1) {
          swipeX = e.changedTouches[0].clientX;
          swipeY = e.changedTouches[0].clientY;
        }
      }, { passive: true });
      stageEl.addEventListener("touchend", function (e) {
        if (e.target.closest && e.target.closest(".side")) { swipeX = null; swipeY = null; return; }
        if (swipeX === null || swipeY === null) return;
        var dx = e.changedTouches[0].clientX - swipeX;
        var dy = e.changedTouches[0].clientY - swipeY;
        swipeX = null; swipeY = null;
        if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
        if (dx < 0 && current < currentList().length - 1) show(current + 1);
        else if (dx > 0 && current > 0) show(current - 1);
      }, { passive: true });

      show(0);
    </script>
  </body>
</html>
